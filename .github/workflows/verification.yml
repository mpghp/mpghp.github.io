name: Vérification du site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Installer Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Générer le site
        run: npm run export
      - name: Vérifier les fichiers générés
        run: npm run verifier
      - name: V?rifier les interactions
        run: npm test
